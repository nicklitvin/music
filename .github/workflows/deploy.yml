name: Deploy

# Pushes to main go straight to the box at DEPLOY_HOST. Also runnable by
# hand from the Actions tab, which is what you want when a deploy fails
# halfway and you just need to re-run it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: a half-applied
# deploy is worse than a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets are set
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          missing=""
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "See deploy/README.md for what each one is." >&2
            exit 1
          fi

      - name: Set up the SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '3.149.2.249' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          if [ -n "$KNOWN_HOSTS" ]; then
            # Pinned host key: the deploy fails rather than trusting an
            # impostor if the host key ever changes.
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust-on-first-use. Works, but means a machine-in-the-middle
            # on the first connection would be accepted silently -- set the
            # SSH_KNOWN_HOSTS secret to close that off (deploy/README.md).
            echo "::warning::SSH_KNOWN_HOSTS not set; falling back to ssh-keyscan (trust on first use)"
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '3.149.2.249' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/music' }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/deploy.pem -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_BRANCH='$DEPLOY_BRANCH' bash -s" \
            < deploy/remote-deploy.sh

      - name: Check the site answers
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '3.149.2.249' }}
        run: |
          # A deploy that leaves the site down should fail loudly, not go green.
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://$DEPLOY_HOST/" || true)
            if [ "$code" = "200" ]; then
              echo "Site responded 200"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code; retrying..."
            sleep 5
          done
          echo "Site did not return 200 after the deploy" >&2
          exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy.pem
